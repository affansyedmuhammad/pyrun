# Kamal deployment for pyrun.
#
# Architecture (docs/DESIGN.md §10): one host, two roles from the SAME image.
#   web  - serves HTTP behind Kamal's TLS proxy. NEVER touches Docker.
#   job  - runs bin/jobs, the only process that can reach the Docker socket and
#          launch sandbox containers on the host daemon.
#
# Host, domain, registry and addresses come from .kamal/deploy.env (untracked, loaded
# by bin/deploy); secrets from .kamal/secrets. Nothing environment-specific is committed.

service: pyrun

# The image name in your registry. For GHCR this is "<github-user>/pyrun".
image: <%= ENV.fetch("PYRUN_IMAGE") %>

# One EC2 host runs both roles. Split onto separate hosts later for capacity.
servers:
  web:
    - <%= ENV.fetch("PYRUN_SERVER") %>
  job:
    hosts:
      - <%= ENV.fetch("PYRUN_SERVER") %>
    cmd: bin/jobs
    options:
      # The worker launches sandboxes on the host daemon via the mounted socket.
      volume: "/var/run/docker.sock:/var/run/docker.sock"
      # The container must be allowed to read that socket. On the host run
      #   getent group docker | cut -d: -f3
      # and put the number here so the worker joins the docker group:
      "group-add": "<%= ENV.fetch("PYRUN_DOCKER_GID") %>"

# TLS is terminated by Kamal's proxy with an automatic Let's Encrypt certificate.
# Needs a real domain whose DNS A record points at the server.
proxy:
  ssl: true
  host: <%= ENV.fetch("PYRUN_DOMAIN") %>
  app_port: 80                # Thruster listens on 80 inside the web container

# Where the built image is pushed and pulled. GHCR is easiest since the code is
# already on GitHub; ECR and Docker Hub are alternatives (see docs/DEPLOYMENT.md).
registry:
  server: ghcr.io
  username: <%= ENV.fetch("PYRUN_REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD  # a GitHub token with write:packages (see .kamal/secrets)

# Environment for every container. Secrets come from .kamal/secrets.
env:
  secret:
    - RAILS_MASTER_KEY         # decrypts credentials (incl. secret_key_base and the encryption keys)
    - SMTP_PASSWORD
  clear:
    # Jobs run in the dedicated job role, NOT inside Puma, so the web process
    # never needs Docker access. Never set SOLID_QUEUE_IN_PUMA here: the web
    # container has no Docker socket, and a Solid Queue supervisor inside Puma
    # would claim sandbox jobs and fail them instantly with "Cannot connect to
    # the Docker daemon" (see docs/DEPLOYMENT.md).
    SANDBOX_RUNNER: docker

    # Boot guard (security review 5 & 10): the app refuses to start in production
    # unless the host size is declared, so sandbox capacity is validated.
    HOST_MEMORY_MB: "2048"      # t3.small has 2 GB
    # Two sandboxes at once on the 2-vCPU box, so two people never wait for each
    # other (each person is still limited to one run at a time). Each may use a
    # full CPU: when both are CPU-bound, web and worker share the cores through
    # the scheduler and stay responsive. Memory: 2 x SANDBOX_MEMORY_MB (256).
    SANDBOX_CONCURRENCY: "2"
    # Runs at a time per person. Keep it at half the sandboxes or fewer, so one
    # person can never take every slot; the boot guard refuses more than exist.
    MAX_CONCURRENT_RUNS_PER_USER: "1"
    HOST_CPUS: "2"             # t3.small has 2 vCPU

    # Identity and links.
    APP_HOST: <%= ENV.fetch("PYRUN_DOMAIN") %>
    ALLOWED_EMAIL_DOMAINS: windbornesystems.com
    ALLOWED_EMAILS: <%= ENV.fetch("PYRUN_ALLOWED_EMAILS", "") %>
    ADMIN_EMAILS: <%= ENV.fetch("PYRUN_ADMIN_EMAILS") %>

    # Mail over SMTP (a provider app password is enough for a demo).
    # The password itself is a secret in .kamal/secrets (SMTP_PASSWORD).
    SMTP_ADDRESS: <%= ENV.fetch("PYRUN_SMTP_ADDRESS") %>
    SMTP_PORT: "587"
    SMTP_USERNAME: <%= ENV.fetch("PYRUN_SMTP_USERNAME") %>
    MAIL_FROM: <%= ENV.fetch("PYRUN_MAIL_FROM") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  prepare: app exec "bin/rails db:prepare"   # run once after the first deploy

# SQLite files (primary, queue, cache, cable) live on a persistent volume.
# Back this path up off-server; on AWS put it on an EBS volume with snapshots.
volumes:
  - "pyrun_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

# EC2 is x86_64. On an Apple-silicon laptop this builds amd64 via emulation
# (slower); a remote builder or GitHub Actions build is faster (see docs/DEPLOYMENT.md).
builder:
  arch: amd64

# The CloudFormation stack uses Amazon Linux 2023, whose SSH user is ec2-user
# (added to the docker group by the instance's user-data).
ssh:
  user: ec2-user
  keys: [ "pyrun.pem" ]

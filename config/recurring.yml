# Solid Queue's scheduler runs these inside bin/jobs. Each is idempotent.
production: &default
  sweep_stale_runs:
    class: SweepStaleRunsJob
    schedule: every minute
  reap_orphan_containers:
    class: ReapOrphanContainersJob
    schedule: every 5 minutes
  expire_run_outputs:
    class: ExpireRunOutputsJob
    schedule: every day at 4am
  expire_sessions:
    class: ExpireSessionsJob
    schedule: every hour

development:
  <<: *default

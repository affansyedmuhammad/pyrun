default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Sandbox runs. Each thread holds a container for up to the timeout, so this
    # number is host capacity; it is validated against HOST_MEMORY_MB at boot.
    - queues: sandbox
      threads: <%= Pyrun.config.sandbox_concurrency %>
      # One indexed query per poll is cheap; 0.5 s here cost ~250 ms of average
      # wait per run on top of the container start.
      polling_interval: 0.1
    # Everything else (mail, Turbo broadcasts) never waits behind a run.
    - queues: [ default, mailers ]
      threads: 3
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

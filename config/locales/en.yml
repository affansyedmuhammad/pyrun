# All user-facing copy. Numbers, domains, and names are interpolated from config,
# never typed here, so changing a limit or an allowlist never means editing copy.
en:
  registrations:
    domain_restricted: "Sign-ups are limited to %{domains} addresses."
    rate_limited: "Sign-ups are busy right now. Please try again in a little while."
  sessions:
    create:
      failed: "Incorrect email or password."
    destroy:
      signed_out: "You have been signed out."
  email_verifications:
    create:
      sent: "We sent a new link to %{email}."
    show:
      expired: "That link has expired. Send yourself a new one below."
      verified: "Email verified. Welcome."
  passwords:
    invalid_token: "That link is invalid or has expired. Request a new one."
    create:
      sent: "If that address has an account, instructions are on their way."
    update:
      updated: "Password updated. Sign in with your new password."
  admin:
    users:
      deactivate:
        done: "Deactivated %{email} and signed them out everywhere."
        self: "You can't deactivate your own account."
      reactivate:
        done: "Reactivated %{email}."
      password_reset:
        done: "Sent a password reset link to %{email}."
        disabled: "That account is disabled. Reactivate it first."
      make_admin:
        done: "%{email} is now an admin."
      remove_admin:
        done: "%{email} is no longer an admin."
        self: "You can't remove your own admin access."
        from_config: "%{email} is an admin through ADMIN_EMAILS. Change the deployment config to remove it."
      sessions:
        done: "Signed %{email} out everywhere."
  runs:
    submit:
      paused: "Runs are paused for maintenance. Try again later."
      too_many_active:
        one: "You already have 1 run waiting or running. Wait for it to finish."
        other: "You already have %{count} runs waiting or running. Wait for one to finish."
      queue_full: "The queue is busy right now. Try again in a minute."
  password_rules:
    length: "At least %{count} characters"
    uppercase: "An uppercase letter"
    lowercase: "A lowercase letter"
    digit: "A number"
    special: "A special character"
  user_mailer:
    email_verification:
      subject: "Verify your email address"
    password_reset:
      subject: "Reset your password"
    existing_account:
      subject: "You already have an account"
  activerecord:
    errors:
      models:
        user:
          attributes:
            email_address:
              blank: "can't be blank"
              invalid: "isn't a valid email address"
            password:
              too_short: "must be at least %{count} characters"
              too_long_bytes: "must be at most %{count} bytes"
              is_email: "can't be your email address"
              missing_uppercase: "must include an uppercase letter"
              missing_lowercase: "must include a lowercase letter"
              missing_digit: "must include a number"
              missing_special: "must include a special character"
            password_confirmation:
              confirmation: "doesn't match the password"
        run:
          attributes:
            code:
              blank: "can't be blank"
              too_long_bytes: "is too long (maximum is %{count} bytes)"
              nul_bytes: "can't contain NUL bytes"
            runtime:
              inclusion: "is not a known runtime"
